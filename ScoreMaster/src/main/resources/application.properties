spring.application.name=ScoreMaster

# Configuração do Banco de Dados
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres?currentSchema=scoremaster
spring.datasource.username=postgres
spring.datasource.password=mavs

# Driver do PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuração do JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=scoremaster

# Dialeto para Postgres
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Não cachear templates (Thymeleaf)
spring.thymeleaf.cache=false

# Não cachear recursos estáticos (CSS/JS)
spring.web.resources.cache.period=0
spring.web.resources.cache.cachecontrol.no-store=true

